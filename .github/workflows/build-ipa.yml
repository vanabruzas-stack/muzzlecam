name: Build unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bundle_id:
        description: "Bundle ID permitted by your provisioning profile"
        required: false
        default: "com.muzzlezoom.camera"
        type: string

permissions:
  contents: read

jobs:
  ipa:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Check out project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify and build
        env:
          BUNDLE_ID: ${{ inputs.bundle_id || 'com.muzzlezoom.camera' }}
        run: bash Scripts/build-ipa.sh dist
      - name: Upload IPA
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MuzzleZoom-unsigned
          path: |
            dist/MuzzleZoom-unsigned.ipa
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
